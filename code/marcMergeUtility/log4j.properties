# Log4j 2 configuration for the MARC merge utility.
# Levels are ordered: DEBUG < INFO < WARN < ERROR < FATAL.
# The root logger passes everything at DEBUG and above; each appender filters with its own threshold.

# Console appender: WARN and above
appender.console.type = Console
appender.console.name = myConsoleAppender
appender.console.layout.type = PatternLayout
appender.console.layout.pattern = %-5p %c - %m%n
appender.console.filter.threshold.type = ThresholdFilter
appender.console.filter.threshold.level = warn

# Rolling file appender: INFO and above, 2000KB per file, 5 backups (mergeutility.log.1 - .5)
appender.rolling.type = RollingFile
appender.rolling.name = MergeLog
appender.rolling.fileName = /var/log/vufind-plus/mergeutility.log
appender.rolling.filePattern = /var/log/vufind-plus/mergeutility.log.%i
appender.rolling.layout.type = PatternLayout
appender.rolling.layout.pattern = %d{yyMMdd HH:mm:ss:SSS} >> %m%n
appender.rolling.policies.type = Policies
appender.rolling.policies.size.type = SizeBasedTriggeringPolicy
appender.rolling.policies.size.size = 2000KB
appender.rolling.strategy.type = DefaultRolloverStrategy
appender.rolling.strategy.min = 1
appender.rolling.strategy.max = 5
appender.rolling.strategy.fileIndex = min
appender.rolling.filter.threshold.type = ThresholdFilter
appender.rolling.filter.threshold.level = info

rootLogger.level = debug
rootLogger.appenderRef.console.ref = myConsoleAppender
rootLogger.appenderRef.rolling.ref = MergeLog
