name: Publish Docker image to hub.docker.com
on:
  push:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Git tag to build, or latest to build the selected branch as latest'
        required: true
        default: 'latest'

env:
  CHECKOUT_REF: ${{ github.event_name == 'workflow_dispatch' && inputs.tag != 'latest' && format('refs/tags/{0}', inputs.tag) || '' }}
  DOCKER_ORG: ${{ vars.DOCKER_ORG || 'aspendiscovery' }}
  GHCR_ORG: ${{ vars.GHCR_ORG || 'aspen-discovery' }}
  QUAY_ORG: ${{ vars.QUAY_ORG || 'aspen-discovery' }}
  DOCKER_PUSH: ${{ vars.DOCKER_PUSH || 'true' }}
  GHCR_PUSH: ${{ vars.GHCR_PUSH || 'true' }}
  QUAY_PUSH: ${{ vars.QUAY_PUSH || 'true' }}
  IMAGE_PREFIX: ${{ vars.IMAGE_PREFIX }}
  PUSH_BRANCH_PATTERN: ${{ vars.PUSH_BRANCH_PATTERN }}

jobs:
  build_docker_images:
    name: Push ${{ matrix.image }} image to container registries
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: aspen
            dockerfile: docker/Dockerfile
          - image: solr
            dockerfile: docker/files/solr/Dockerfile
          - image: tunnel
            dockerfile: docker/files/tunnel/Dockerfile
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4
        with:
          ref: ${{ env.CHECKOUT_REF }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Select image tags
        id: image_tags
        shell: bash
        env:
          IMAGE_NAME: ${{ matrix.image }}
          REQUESTED_TAG: ${{ inputs.tag }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            image_tags=("$REQUESTED_TAG")
            push=true
          elif [[ "$GITHUB_REF" == refs/tags/* ]]; then
            image_tags=(latest "${GITHUB_REF#refs/tags/}")
            push=true
          elif [[ -n "$PUSH_BRANCH_PATTERN" && "$GITHUB_REF_NAME" =~ $PUSH_BRANCH_PATTERN ]]; then
            # Docker tags can't contain slashes and most punctuation, so 'backports/DIS-1234' becomes 'backports-DIS-1234'
            image_tags=("${GITHUB_REF_NAME//[^A-Za-z0-9_.-]/-}")
            push=true
          else
            image_tags=(latest NOTHING)
            push=false
          fi

          repositories=()
          if [[ "$DOCKER_PUSH" == "true" ]]; then
            repositories+=("$DOCKER_ORG")
          fi
          if [[ "$GHCR_PUSH" == "true" ]]; then
            repositories+=("ghcr.io/$GHCR_ORG")
          fi
          if [[ "$QUAY_PUSH" == "true" ]]; then
            repositories+=("quay.io/$QUAY_ORG")
          fi

          # With every registry switched off there are no tags to push to
          if [[ ${#repositories[@]} -eq 0 ]]; then
            push=false
          fi

          echo "push=$push" >> "$GITHUB_OUTPUT"
          {
            echo "tags<<EOF"
            for image_tag in "${image_tags[@]}"; do
              for repository in "${repositories[@]}"; do
                echo "$repository/$IMAGE_PREFIX$IMAGE_NAME:$image_tag"
              done
            done
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Extract branch name
        shell: bash
        run: echo "branch=${GITHUB_HEAD_REF:-${GITHUB_REF#refs/heads/}}" >> $GITHUB_OUTPUT
        id: extract_branch

      - name: Log in to Docker Hub
        if: steps.image_tags.outputs.push == 'true' && env.DOCKER_PUSH == 'true'
        uses: docker/login-action@f4ef78c080cd8ba55a85445d5b36e214a81df20a
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Log in to GHCR
        if: steps.image_tags.outputs.push == 'true' && env.GHCR_PUSH == 'true'
        run: echo "${{ secrets.GHCR_PASSWORD }}" | docker login ghcr.io -u ${{ secrets.GHCR_USERNAME }} --password-stdin

      - name: Log in to Quay.io
        if: steps.image_tags.outputs.push == 'true' && env.QUAY_PUSH == 'true'
        uses: docker/login-action@f4ef78c080cd8ba55a85445d5b36e214a81df20a
        with:
          registry: quay.io
          username: ${{ secrets.QUAY_USERNAME || secrets.QUAY_USER }}
          password: ${{ secrets.QUAY_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: ${{ steps.image_tags.outputs.push == 'true' }}
          tags: ${{ steps.image_tags.outputs.tags }}
