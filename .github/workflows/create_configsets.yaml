name: Create Configsets For SolrCloud

# Natively triggers on PR creation, PR updates (synchronize), and PR reopens
on: pull_request

jobs:
  create_configsets:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      # Generates tarball in the root of the workspace
      - name: Create ConfigSet Tarball
        run: |
          cd data_dir_setup/solr7
          tar -czf ../../configsets.tar.gz $(find . -maxdepth 1 -type d ! -name '.' -printf '%f\n')

      # FIX 1: Split into two steps. First, set up the tool...
      - name: Setup ORAS
        uses: oras-project/setup-oras@v1
        
      # ...then verify it runs.
      - name: Verify ORAS version
        run: oras version
      
      # 1st: Safely resolve and sanitize the branch name
      - name: Sanitize Branch Name for OCI Tag
        shell: bash
        run: |
          RAW_BRANCH="${{ github.head_ref || github.ref_name }}"
          CLEAN_BRANCH=$(echo "$RAW_BRANCH" | sed 's/[^a-zA-Z0-9_.-]/-/g' | tr '[:upper:]' '[:lower:]')
          echo "OCI_TAG=${CLEAN_BRANCH}" >> $GITHUB_ENV

      # 2nd: Authenticate to GHCR
      - name: Log in to GitHub Container Registry
        run: |
          echo "${{ github.token }}" | oras login ghcr.io -u ${{ github.actor }} --password-stdin

      # 3rd: Package and Push the Configsets using your dynamic tag
      # FIX 2: Removed "cd" so it stays in the workspace, and added "$" to the echo context
      - name: Package & Push OCI Artifact
        run: |
          echo "${{ github.repository }}"
          oras push ghcr.io/${{ github.repository }}/configsets:${{ env.OCI_TAG }} ./configsets.tar.gz