name: Create Configsets For SolrCloud

on:
  pull_request:
    types: [opened]

jobs:
  create_configsets:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Create ConfigSet Tarball
        run: |
          cd data_dir_setup/solr7
          tar -czf ../../configsets.tar.gz $(find . -maxdepth 1 -type d ! -name '.' -printf '%f\n')
      
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: configsets
          path: configsets.tar.gz
