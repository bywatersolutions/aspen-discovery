name: Create Configsets For SolrCloud

# Natively triggers on PR creation, PR updates (synchronize), and PR reopens
on: pull_request

jobs:
  create_configsets:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      # Safely resolve and sanitize the branch name
      - name: Sanitize Branch Name for OCI Tag
        shell: bash
        run: |
          RAW_BRANCH="${{ github.head_ref || github.ref_name }}"
          CLEAN_BRANCH=$(echo "$RAW_BRANCH" | sed 's/[^a-zA-Z0-9_.-]/-/g' | tr '[:upper:]' '[:lower:]')
          echo "OCI_TAG=${CLEAN_BRANCH}" >> $GITHUB_ENV

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and Push Configsets Image
        uses: docker/build-push-action@v5
        with:
          context: ./data_dir_setup/solr7
          # We use a simple inline Dockerfile to copy the files into a clean image
          inline-file: |
            FROM alpine:latest
            COPY . /configsets
          push: true
          tags: ghcr.io/${{ github.repository }}/configsets:${{ env.OCI_TAG }}